services:
  postgres:
    image: postgres:16-alpine
    container_name: eksamadhan-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-eksamadhan}
      POSTGRES_USER: ${DB_USERNAME:-eksamadhan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-eksamadhan}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
