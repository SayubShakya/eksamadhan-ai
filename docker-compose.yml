services:
  postgres:
    # pgvector's official image: PostgreSQL 16 with the `vector` extension available.
    # Same major version and on-disk format as postgres:16, so the existing volume is
    # reused. It is Debian-based rather than Alpine, so the first start may report a
    # collation version mismatch (musl vs glibc) — refresh it with
    # `ALTER DATABASE eksamadhan REFRESH COLLATION VERSION; REINDEX DATABASE eksamadhan;`
    image: pgvector/pgvector:pg16
    container_name: eksamadhan-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-eksamadhan}
      POSTGRES_USER: ${DB_USERNAME:-eksamadhan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # This computer only. "5432:5432" listened on every network the laptop joins, so anyone on
    # the same Wi-Fi could reach the database and try its password.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-eksamadhan}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The whole application in containers (project packaging): `docker compose --profile app up`.
  # Development still runs the backend and frontend directly (run.sh); this profile is for anyone
  # who only wants to run EkSamadhan: a marker, or a fresh machine. See INSTALL.md.
  backend:
    profiles: ["app"]
    build: ./backend
    container_name: eksamadhan-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      # Inside Docker the database and the AI model are reached by their container or host name.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-eksamadhan}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
      FRONTEND_URL: ${APP_URL:-http://localhost:8088}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The backend reads its settings file from its working directory as well (Dotenv).
      - ./backend/.env:/app/.env:ro
      - media_data:/app/media
    restart: unless-stopped

  frontend:
    profiles: ["app"]
    build: ./frontend
    container_name: eksamadhan-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
