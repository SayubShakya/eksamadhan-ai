services:
  postgres:
    # pgvector's official image: PostgreSQL 16 with the `vector` extension available.
    # Same major version and on-disk format as postgres:16, so the existing volume is
    # reused. It is Debian-based rather than Alpine, so the first start may report a
    # collation version mismatch (musl vs glibc) — refresh it with
    # `ALTER DATABASE eksamadhan REFRESH COLLATION VERSION; REINDEX DATABASE eksamadhan;`
    image: pgvector/pgvector:pg16
    container_name: eksamadhan-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-eksamadhan}
      POSTGRES_USER: ${DB_USERNAME:-eksamadhan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-eksamadhan}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
