spring:
  application:
    name: eksamadhan-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eksamadhan}
    username: ${DB_USERNAME:eksamadhan}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # TODO(Phase 1): replace with Flyway migrations and set this to `validate`
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5174}
  # Voice notes recorded in the dashboard are transcoded and kept here so agents can
  # replay what they sent. Meta's own copy is not fetchable after the fact.
  media-dir: ${MEDIA_DIR:media}

spring.servlet.multipart:
  max-file-size: 25MB
  max-request-size: 25MB
