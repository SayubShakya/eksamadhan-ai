spring:
  application:
    name: eksamadhan-ai
  main:
    # Both webmvc and webflux are on the classpath (MetaService uses WebClient). MVC wins
    # the deduction anyway, but stating it keeps the reactive security stack out of play.
    web-application-type: servlet
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eksamadhan}
    username: ${DB_USERNAME:eksamadhan}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    # This database already exists, created by ddl-auto. Baselining at 1 marks V1 as
    # already applied here, while a fresh database runs it normally.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # The schema is owned by src/main/resources/db/migration. `validate` fails fast
      # when an entity and the schema disagree, instead of silently diverging.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}
  error:
    # The frontend shows these messages to the user, so they must be present — but a stack
    # trace in an HTTP response is an information leak.
    include-message: always
    include-stacktrace: never
    include-exception: false

app:
  # HS256 signing key for session tokens. At least 32 characters. If unset, a random key is
  # generated at startup, which signs everyone out on every restart.
  jwt:
    secret: ${JWT_SECRET:}
  # The workspace that predates accounts. The first person to sign up adopts it, so the
  # connected Facebook Page and its message history survive the move to real accounts.
  # Clearing this disables adoption; it can only ever fire once in any case.
  adoptable-organization-api-key: ${ADOPTABLE_ORG_API_KEY:demo-tenant-1}
  # Retrieval-augmented generation. One OpenRouter key covers embeddings now and chat
  # completions in the next phase.
  ai:
    # Chat and embeddings are configured separately, because they need not come from the
    # same place: a local Ollama is free and private for chat, while embeddings are usually
    # better left on a hosted model — see the dimensions note below. Both speak the OpenAI
    # format, so switching is a URL and a model name.
    #
    # These two remain the single-provider shortcut: set them and both halves follow.
    openrouter-key: ${OPEN_ROUTER_KEY:}
    openrouter-url: ${OPENROUTER_URL:https://openrouter.ai/api/v1}

    chat:
      # The one switch: openrouter (hosted) or local (Ollama). It picks the URL, the model,
      # the token budget and the timeout together, because a local reasoning model needs all
      # four changed — setting only the URL is how you end up pointing at Ollama with a
      # 20-second timeout and escalating every reply.
      provider: ${AI_CHAT_PROVIDER:openrouter}

      # Each of these overrides the provider's default. Blank means "use the default".
      base-url: ${CHAT_BASE_URL:}
      model: ${CHAT_MODEL:}
      max-tokens: ${CHAT_MAX_TOKENS:0}
      timeout-seconds: ${AI_REPLY_TIMEOUT:0}
      # Reading images needs a model that can see; blank falls back to the chat model.
      vision-model: ${VISION_MODEL:}
      # Ignored by a local provider, which needs no key.
      api-key: ${CHAT_API_KEY:${OPEN_ROUTER_KEY:}}

      hosted:
        model: ${HOSTED_CHAT_MODEL:openai/gpt-4o-mini}
      local:
        base-url: ${OLLAMA_URL:http://localhost:11434/v1}
        model: ${OLLAMA_MODEL:gemma4:latest}

    embeddings:
      base-url: ${EMBEDDINGS_BASE_URL:${OPENROUTER_URL:https://openrouter.ai/api/v1}}
      api-key: ${EMBEDDINGS_API_KEY:${OPEN_ROUTER_KEY:}}
      # openai/text-embedding-3-small is the model the contextual report names, reached
      # through OpenRouter.
      model: ${EMBEDDING_MODEL:openai/text-embedding-3-small}
      # Baked into the schema as vector(1536). Changing the embedding model to one with a
      # different width means a migration and a full re-index, so this is checked at startup
      # rather than discovered when a write fails.
      dimensions: ${EMBEDDING_DIMENSIONS:1536}

    chunk-size: ${CHUNK_SIZE:900}
    chunk-overlap: ${CHUNK_OVERLAP:150}
    # A passage smaller than this is merged into the next. A page that is mostly a list of
    # short links would otherwise become hundreds of passages that match on a heading and
    # answer nothing.
    min-chunk-size: ${MIN_CHUNK_SIZE:250}
    top-k: ${RETRIEVAL_TOP_K:5}
    # Answer generation. Set auto-reply to false to run the inbox purely manually.
    auto-reply: ${AI_AUTO_REPLY:true}
    chat-model: ${CHAT_MODEL:openai/gpt-4o-mini}
    # The two thresholds. Below min-similarity the retrieval is treated as weak: the passages
    # are dropped and the model still answers, so "hello" is met conversationally rather than
    # escalated. min-confidence is the model's own verdict on how well the passages support
    # its answer; below it, a human takes the conversation.
    # Starting values come from the measurements in docs/sample-knowledge-base.md.
    min-similarity: ${AI_MIN_SIMILARITY:0.25}
    min-confidence: ${AI_MIN_CONFIDENCE:0.55}
    # Sent once when a conversation is handed to a human, so the customer is not left
    # watching silence. Blank to disable.
    # A conversation must be quiet this long before its handover brief is written. Summarising
    # mid-exchange spends a model call on a conversation that is still moving.
    summary-cooldown-seconds: ${AI_SUMMARY_COOLDOWN:30}
    # How many unrelated messages in a row before the AI closes the conversation itself.
    # The first few are answered as conversation: people say hello, and a real customer
    # phrasing something oddly should not be shut out.
    off-topic-limit: ${AI_OFF_TOPIC_LIMIT:3}
    # Nothing else bounds the prompt: passage length is whatever the source document held, and
    # a prompt that crowds out the reply budget comes back as half-written JSON.
    max-context-chars: ${AI_MAX_CONTEXT_CHARS:6000}
    # The only automatic retry in the system, and it sits under the human one. Transient
    # provider failures only — never a timeout, never a bad request. 1 disables it.
    retry:
      max-attempts: ${AI_RETRY_ATTEMPTS:3}
    unrelated-message: ${AI_UNRELATED_MESSAGE:I can only help with questions about our products and orders, so I will close this conversation here. Message us again any time you need something.}
    handover-message: ${AI_HANDOVER_MESSAGE:Let me check that with a colleague — someone from our team will reply here shortly.}
  # The Jev firewall (TypeSafe): one decision-model call per customer message, before the
  # reply model. off | shadow | on. Shadow judges every message and records what it would
  # have done, while the existing pipeline answers as usual — run it first, and compare.
  # On acts on what it is sure of and falls through to the pipeline for everything else.
  # With no API key the mode is off, whatever this says.
  triage:
    mode: ${TRIAGE_MODE:shadow}
    api-key: ${TYPESAFE_API_KEY:}
    model: ${TRIAGE_MODEL:jev-latest}
    # Short on purpose: in "on" mode the customer waits for this. A timeout falls back to
    # the normal pipeline rather than failing the reply.
    timeout-ms: ${TRIAGE_TIMEOUT_MS:3000}
    # Measured on the real messages in the database; see MessageTriageService.
    intent-threshold: ${TRIAGE_INTENT_THRESHOLD:0.9}
    human-threshold: ${TRIAGE_HUMAN_THRESHOLD:0.65}
    injection-threshold: ${TRIAGE_INJECTION_THRESHOLD:0.7}
    greeting-reply: ${TRIAGE_GREETING_REPLY:Hi! How can I help you today?}
    thanks-reply: ${TRIAGE_THANKS_REPLY:You're welcome! Let me know if there is anything else I can help with.}
  # The platform operator. Created at startup from these two, in a workspace of its own; never
  # through signup or an invitation. Blank email means there is no system admin. The password
  # is read only to create the account (12 characters at least) and never overwrites it after.
  system-admin:
    email: ${SYSTEM_ADMIN_EMAIL:}
    password: ${SYSTEM_ADMIN_PASSWORD:}
  email:
    resend-key: ${RESEND_API_KEY:}
    # Until a domain is verified at resend.com/domains, Resend allows only this sender and
    # delivers only to the account owner's own address. Verify a domain before inviting
    # anyone else, then set EMAIL_FROM to an address at that domain.
    from: ${EMAIL_FROM:EkSamadhan AI <onboarding@resend.dev>}
    enabled: ${EMAIL_ENABLED:true}
  # Two pools: one for answering customers, one for everything nobody is waiting on. Core size
  # is the real concurrency — a Spring executor only grows past it once the queue is full.
  async:
    reply-threads: ${ASYNC_REPLY_THREADS:6}
    background-threads: ${ASYNC_BACKGROUND_THREADS:3}
  # Catching up on messages the live webhook never delivered — see SyncService.answerMissed.
  sync:
    catch-up-after-seconds: ${SYNC_CATCH_UP_AFTER:30}
    catch-up-window-hours: ${SYNC_CATCH_UP_WINDOW_HOURS:12}
    # Messenger history older than this ISO timestamp is never imported. Blank imports
    # everything. Set it when clearing test data, or the sync fetches it straight back.
    ignore-before: ${SYNC_IGNORE_BEFORE:}
  # Browser notifications for agents (FR-06), over the Web Push standard. Blank keys turn
  # the feature off cleanly: the dashboard never asks for permission and nothing is sent.
  # A new key pair invalidates every stored subscription, so agents must re-enable them.
  push:
    subject: ${VAPID_SUBJECT:mailto:support@eksamadhan.ai}
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
  # Crawling someone's website means making requests they did not ask for, and every page
  # costs an embedding call. The limits are the feature, not a shortcut.
  crawler:
    max-pages: ${CRAWLER_MAX_PAGES:25}
    max-depth: ${CRAWLER_MAX_DEPTH:2}
    delay-ms: ${CRAWLER_DELAY_MS:400}
  frontend-url: ${FRONTEND_URL:http://localhost:5174}
  # Voice notes recorded in the dashboard are transcoded and kept here so agents can
  # replay what they sent. Meta's own copy is not fetchable after the fact.
  media-dir: ${MEDIA_DIR:media}

spring.servlet.multipart:
  max-file-size: 25MB
  max-request-size: 25MB
