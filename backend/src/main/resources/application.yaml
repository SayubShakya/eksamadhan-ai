spring:
  application:
    name: eksamadhan-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eksamadhan}
    username: ${DB_USERNAME:eksamadhan}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    # This database already exists, created by ddl-auto. Baselining at 1 marks V1 as
    # already applied here, while a fresh database runs it normally.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # The schema is owned by src/main/resources/db/migration. `validate` fails fast
      # when an entity and the schema disagree, instead of silently diverging.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5174}
  # Voice notes recorded in the dashboard are transcoded and kept here so agents can
  # replay what they sent. Meta's own copy is not fetchable after the fact.
  media-dir: ${MEDIA_DIR:media}

spring.servlet.multipart:
  max-file-size: 25MB
  max-request-size: 25MB
