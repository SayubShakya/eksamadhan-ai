# The dashboard and its API on one address, as the Vite dev server does in development
# (frontend/vite.config.js): the same rules, so the packaged app behaves like the one tested.
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 30m;

    # Website chat: the Origin header is how the backend checks the chat box is on a listed
    # website, so it is passed on unchanged.
    location /api/widget/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the page and the API share this origin, and the API authenticates with a
    # bearer token, so the Origin header is dropped (the backend would otherwise refuse it).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live updates (server-sent events) must not be held back by a buffer.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # The service worker and app manifest must never be cached, or an update never arrives.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Built files have hashed names, so they can be cached for good.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # Every other address is a page of the single-page app.
    location / { try_files $uri $uri/ /index.html; }
}
