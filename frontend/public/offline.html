<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>EkSamadhan AI — offline</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           box-sizing: border-box; background: #f2f4f7; color: #111827;
           font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 360px; text-align: center; background: #fff; border: 1px solid #e5e7eb;
           border-radius: 16px; padding: 32px 24px; }
    svg { width: 56px; height: 56px; }
    h1 { font-size: 20px; margin: 16px 0 6px; }
    p { margin: 0 0 20px; color: #4b5563; }
    button { font: inherit; font-weight: 600; color: #fff; background: #2563eb; border: 0;
             border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <!-- Drawn inline: with no connection, not even an icon file can be fetched. -->
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="11" fill="#2563eb"/>
      <g transform="translate(9,9.6) scale(0.625)">
        <g fill="#fff">
          <rect x="3" y="7" width="23" height="6.8" rx="3.4"/><rect x="3" y="18.6" width="14" height="6.8" rx="3.4"/>
          <rect x="3" y="30.2" width="23" height="6.8" rx="3.4"/>
          <path d="M32 15h11a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-5l-5 4.5V31h-1a4 4 0 0 1-4-4v-8a4 4 0 0 1 4-4z"/>
        </g>
        <g fill="#2563eb" transform="translate(24.85,5.52) scale(0.62)">
          <path d="M15.4 22.5h3.1l4.6 11.4h-3.2l-.8-2.2h-4.5l-.8 2.2h-3.1zm2.8 6.8-1.3-3.6-1.3 3.6z"/><rect x="26.2" y="22.5" width="3.1" height="11.4" rx="1"/>
        </g>
      </g>
    </svg>
    <h1>You're offline</h1>
    <p>EkSamadhan needs a connection to show your conversations. They are safe — nothing is lost while you are away.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
