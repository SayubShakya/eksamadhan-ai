    <!-- The in-app splash. Inline on purpose: it paints while this file is still being parsed,
         long before the bundle arrives and React mounts. White, like the manifest's
         background_color and the iOS launch images, so nothing flashes between them.
         In a browser tab it shows the blue tile. In the INSTALLED app it shows no logo: Android
         (and iOS) have already shown one on their own launch screen, and a second one popping
         up after it read as two splash screens. The logo is written by
         scripts/generate-pwa-assets.mjs. -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: grid; place-items: center;
        background: #ffffff;
        opacity: 1; visibility: visible;
        transition: opacity .28s ease, visibility 0s linear .28s;
      }
      #splash.splash--out { opacity: 0; visibility: hidden; }
      #splash svg { width: 116px; height: 116px; display: block; }
      @media (display-mode: standalone), (display-mode: minimal-ui) {
        #splash svg { visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
    </style>
    <!-- Without JavaScript nothing would ever remove it. -->
    <noscript><style>#splash { display: none; }</style></noscript>
